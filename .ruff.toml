target-version = "py312"
line-length = 120
exclude = [
  ".git,",
  "__pycache__",
  "build",
  "stixpy/version.py",
]

[lint]
select = [
  "E",
  "F",
  "W",
  "UP",
  "PT",
  "I",
  "B",
  "BLE",
  "A",
  "C4",
]
ignore = [
  # pycodestyle (E, W)
  "E501", # ignore line length will use a formatter instead
  # pytest (PT)
  "PT001", # Always use pytest.fixture()
  "PT007", # Parametrize should be lists of tuples  # TODO! fix
  "PT011", # Too broad exception assert             # TODO! fix
  "PT023", # Always use () on pytest decorators
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "RUF013", # PEP 484 prohibits implicit `Optional`
  "RUF015", # Prefer `next(iter(...))` over single element slice
  # Bugbear (B)
  "B9", # Very opinionated checks
]

[lint.per-file-ignores]
# Part of configuration, not a package.
"setup.py" = [
  "INP001",  # File is part of an implicit namespace package.
]
"conftest.py" = [
  "INP001",  # File is part of an implicit namespace package.
]
"docs/conf.py" = [
  "E402",  # Module imports not at top of file
  "I",  # isort
]
"docs/*.py" = [
  "INP001",  # File is part of an implicit namespace package.
]
"examples/**.py" = [
  "T201", # allow use of print in examples
  "INP001", # File is part of an implicit namespace package.
  "B018", # Found useless expression.
]
"__init__.py" = [
  "E402",  # Module level import not at top of cell
  "F401",  # Unused import
  "F403",  # from {name} import * used; unable to detect undefined names
  "F405",  # {name} may be undefined, or defined from star imports
  "I", # isort
]
"test_*.py" = [
  "E402", # Module level import not at top of cell
]

[lint.flake8-pytest-style]
parametrize-names-type = "csv"

[lint.pydocstyle]
convention = "numpy"

[lint.isort]
default-section = "third-party"
section-order = [
  "future",
  "standard-library",
  "third-party",
  "astropy",
  "sunpy",
  "first-party",
  "local-folder",
]
known-first-party = ["stixpy"]
no-lines-before = ["local-folder"]

[lint.isort.sections]
"astropy" = ["astropy", "asdf", "gwcs", "reproject"]
"sunpy" = ["sunpy"]
